[python]
# Use pypi.org (reachable over IPv4 from the build sandbox). The Tsinghua
# mirror resolves to an IPv6-only address here that the sandbox cannot reach.
# Local vendored wheels are a fallback find-links source.
pip_repos = ["https://pypi.org/simple", "dir:third_party/wheels"]
obfuscation = false

[python.dependencies]
common = ["py_trees==2.4.0"]

[platform]
supports = ["sim_x86_64", "sim_aarch64", "real_jetson"]

